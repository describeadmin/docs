#
# 选择器已对照真实源码核实：
# frontend/packages/effects/system-ui/src/views/dept/index.vue
# （2026-08-26，随本文件一起提交时的状态；页面改动后如果选择器改了，
# 这里也要跟着改——不要凭这份文件反推页面长什么样）。
#
# ✅ 已于 2026-08-26 真实跑通一次（steps + 两条 assertions + cleanup 全绿），
# 报告见 ../results/1366b1e4/dept-create-20260826-093540/report.md。
# preconditions.login_as 与 evidence 的 on_error 分支仍未覆盖，见 VISUAL_TESTING.md「现状」一节。

scenario: 新增部门后在部门列表中可见
description: >
  系统管理 - 部门管理的最基础路径：新增一条部门记录，验证页面表格与数据库都能看到它。
  同时是 UI 断言 + DB 断言配合使用的示例（develop_plan.md 5.4：不能只凭页面看起来
  正常就下结论）。

preconditions:
  - login_as: admin

steps:
  - action: navigate
    target: /system/dept
  - action: click
    selector: '[data-testid="dept-add-btn"]'
  - action: fill
    selector: '[data-testid="dept-dept-name-input"]'
    value: "测试部门-自动化"
  - action: click
    selector: '[data-testid="dept-submit-btn"]'

assertions:
  - type: ui
    selector: '[data-testid="dept-table"]'
    expect: contains_text("测试部门-自动化")
  - type: db
    query: "SELECT COUNT(*) FROM sys_dept WHERE dept_name = '测试部门-自动化' AND deleted = 0"
    expect: equals(1)

cleanup:
  - query: "DELETE FROM sys_dept WHERE dept_name = '测试部门-自动化'"

evidence:
  - screenshot: after_each_step
  - console_log: on_error
  - network_log: on_error
