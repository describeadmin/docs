# describeadmin 仓库清单
#
# 本项目采用「按模块细分多仓」拓扑（见 develop_plan.md 3.1.1）。
# 该文件是全部仓库的唯一登记处，供 scripts/clone-all.sh 与 AI Agent 获取完整上下文使用。
#
# publishes 字段登记的是【交付给业务方的制品】。业务方如何消费这些制品，
# 见 develop_plan.md 第九章「业务方接入路径」——标注 planned 的条目即该章新增的交付物。
#
# 用法：./scripts/clone-all.sh          克隆/更新全部 status: active 的仓库
#       ./scripts/clone-all.sh core     只处理 group: core

org: describeadmin
host: github.com

# 工作区布局：
#   describe-admin/          ← 工作区根目录，【不是】 git 仓库
#   ├── docs/                ← 本仓库所在处（元信息）
#   ├── framework/           ← 独立 git 仓库
#   ├── sample-app/          ← 独立 git 仓库
#   └── frontend/            ← 独立 git 仓库
#
# 各仓库检出到本文件所在目录（docs/）的同级。

repos:
  # ---------- 元仓库 ----------
  - name: docs
    group: meta
    status: active
    desc: 开发方案、版本基线、编码规范母本、发布手册、仓库清单与工具脚本
    note: 即当前仓库，clone-all.sh 会跳过自身；不发布任何制品

  # ---------- 后端框架核心 ----------
  - name: framework
    group: core
    status: active
    lang: java
    desc: framework-bom + framework-core 全部必选模块
    modules:
      - framework-bom
      - framework-common
      - framework-web-starter
      - framework-security-starter
      - framework-mybatis-starter
      - framework-system-starter      # 用户/角色/菜单/部门管理（建设中）
      - describeadmin-archetype       # 业务方后端工程脚手架（见 9.2.2）
    publishes:
      - io.github.describeadmin:framework-bom
      - io.github.describeadmin:framework-common
      - io.github.describeadmin:framework-web-starter
      - io.github.describeadmin:framework-security-starter
      - io.github.describeadmin:framework-mybatis-starter
      - io.github.describeadmin:framework-system-starter
      # 业务方 `mvn archetype:generate` 的入口（9.2.2）。
      # 与框架同仓发布、版本号保持一致——它生成的 POM 里写的就是框架版本。
      # 职责是把发现 ②⑤ 两个接入坑固化成默认正确的初始状态，使其对业务方不可见。
      # （发现 ⑥ 的处置已推翻，⑧ 已由框架侧解决，见 VERSION_BASELINE 第八轮）
      - io.github.describeadmin:describeadmin-archetype

  # ---------- 代码生成器 ----------
  - name: codegen
    group: tools
    status: active
    lang: java
    desc: 代码生成器，以 YAML/DSL 为主输入（见 develop_plan.md 3.3.1）
    note: |
      不依赖任何 framework-* 模块——只产出源码文本，运行时不需要框架类。
      产出含结构化端到端验收用例，连接目标 #2（面向 AI 编程）与 #3（AI 自主测试）。
      ⚠️ 它是【命令行工具，不是库】：绝不出现在业务方 pom.xml 的 <dependencies> 中（9.4）。
      会同时向两个仓库输出（Java/SQL → <业务>-server，Vue/TS → <业务>-web），
      因此交付形态必须能跨仓工作。
    publishes:
      # ⚠️ 尚未发布。POM 已配齐 Central 所需的 license/developers/scm/url 与 shade 打包，
      #    但本仓【没有 release.yml】，发布链路尚未打通（framework 仓已有）。
      # 主交付形态（planned，9.4.1）：业务方在 <build><plugins> 中声明，
      # frontendOut 指向同级的 <业务>-web；版本由 framework-bom 仲裁，与框架版本联动。
      # 选插件而非 java -jar 的理由见 9.4.1——它在 pom.xml 里是可被 AI Agent 发现的。
      - io.github.describeadmin:describeadmin-codegen-maven-plugin
      # 辅助形态：可执行 fat jar，随 GitHub Release 分发，供非 Maven 场景与 CI 使用
      - io.github.describeadmin:codegen

  - name: db-compat-checker
    group: tools
    status: planned
    lang: java
    desc: 数据库兼容性自检工具（见 develop_plan.md 2.3.3 / 5.5）

  # ---------- 后端可选插件 ----------
  - name: framework-auth-zhengwuding-starter
    group: ext
    status: planned
    lang: java
    spi: AuthProvider
    desc: 浙政钉登录

  - name: framework-notify-dingtalk-starter
    group: ext
    status: planned
    lang: java
    spi: NotifyChannel
    desc: 钉钉消息推送

  # ---------- 前端 ----------
  - name: frontend
    group: web
    status: active
    lang: ts
    desc: 由 Vben Admin 5.7.0 一次性取材后独立演进（见 develop_plan.md 4.1）
    upstream: https://github.com/vbenjs/vue-vben-admin
    upstream_snapshot: v5.7.0
    upstream_tracking: false   # 已与上游断开，不做 merge
    app: apps/admin            # 唯一应用，由官方 apps/web-ele 更名而来
    note: |
      packages/ 下全部代码的维护责任（含安全修复）自快照之日起由框架团队承担，
      上游的更新与 bugfix 不会自动流入。见 NOTICE.md。
      应用直连真实后端，不带 mock —— 上游的 apps/backend-mock 已删除。
    publishes:
      # ⚠️ 尚未发布。这些包目前以源码形式（exports 指向 src/*.ts）在 workspace 内互引，
      #    要真正 publish 还需补 tsdown 构建产物与 publishConfig，属未完成事项。
      - "@describeadmin/ui"
      - "@describeadmin/layouts"
      - "@describeadmin/access"
      - "@describeadmin/request"
      # planned（9.3.1）：系统管理四个页面（实测 1,376 行）目前在 apps/admin 的应用层，
      # 与后端 framework-system-starter 不对称——业务方复制走应用外壳后，
      # 框架对这些页面的修复将无法到达。收进本包后业务方只保留路由挂载点。
      - "@describeadmin/system-ui"
      # planned（9.3.2）：`npm create @describeadmin/app` 的实现包。
      # 生成业务方的应用外壳（收走 system-ui 后约 2,200 行），替代 fork apps/admin。
      # 外壳不会自动升级，因此必须尽可能薄——这是升级机制成立的前提，不是洁癖。
      - "@describeadmin/create-app"

  # ---------- 样板 / 验证 ----------
  - name: sample-app
    group: sample
    status: active
    lang: java
    desc: 业务模拟样板应用，用于发版前的兼容性测试门禁（见 develop_plan.md 第七章）
    note: |
      测试夹具，【不是产品的一部分】，永远不发布到 Maven Central。
      以真实业务方姿态消费框架：继承 spring-boot-starter-parent、只 import framework-bom、
      不写任何框架模块的版本号，因此「只有真实业务工程才会暴露」的问题会在这里被发现。
      ⚠️ 自 0.1.1 起【不再是业务方的接入起点】——那是 describeadmin-archetype 的职责。
      本仓保留的 maven-toolchains-plugin 也只服务于「以最低支持版本 JDK 17 构建」这个
      框架侧验证目的，业务工程不应照抄（见 VERSION_BASELINE 发现 ⑥ 的修正）。
